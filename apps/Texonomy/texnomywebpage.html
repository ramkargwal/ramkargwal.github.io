
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animal Taxonomy Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f5fff7;
min-height:100vh;
}

header{
text-align:center;
padding:30px 15px;
}

h1{
font-size:3rem;
font-weight:800;
background:linear-gradient(90deg,#00c853,#00e676,#00b0ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

#searchBox{
width:90%;
max-width:700px;
padding:18px 25px;
font-size:18px;
border:none;
border-radius:50px;
outline:none;
background:white;
box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding:25px;
}

.card{
display:block;
text-decoration:none;
color:#222;
border-radius:20px;
overflow:hidden;
background:white;
box-shadow:0 8px 20px rgba(0,0,0,.12);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card-content h3{
color:#2e8b57;
margin-bottom:10px;
}

.card-content p{
margin:5px 0;
}

.no-results{
text-align:center;
font-size:22px;
padding:40px;
}

.footer{
margin-top:20px;
padding:15px;
text-align:center;
background:#eef9f2;
font-weight:600;
}

</style>
</head>

<body>

<header>

<h1>Animal Taxonomy Explorer</h1>

<input
type="text"
id="searchBox"
placeholder="Search Animal..."
>

</header>

<div id="grid" class="grid"></div>

<footer class="footer">
© Copyright Ram Kargwal 2026
</footer>

link:"hanuman-langur.html"

const grid = document.getElementById("grid");

function renderCards(data){

grid.innerHTML = "";

if(data.length === 0){
grid.innerHTML =
'<div class="no-results">No matching taxonomy found.</div>';
return;
}

data.forEach(item=>{

const card=document.createElement("a");

card.className="card";
card.href=item.link;

card.innerHTML=`
<img src="${item.image}" alt="${item.name}">
<div class="card-content">
<h3>${item.name}</h3>
<p><b>Scientific Name:</b> ${item.scientific}</p>
<p><b>Group:</b> ${item.group}</p>
</div>
`;

grid.appendChild(card);

});

}

renderCards(taxonomyData);

document
.getElementById("searchBox")
.addEventListener("input",function(){

const value=this.value.toLowerCase();

const filtered=taxonomyData.filter(item=>

item.name.toLowerCase().includes(value) ||
item.scientific.toLowerCase().includes(value) ||
item.group.toLowerCase().includes(value)

);

renderCards(filtered);

});

</script>
