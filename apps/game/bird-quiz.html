<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #f2f7ef;
            --bg-2: #dcefd8;
            --card: rgba(255, 255, 255, 0.92);
            --text: #183329;
            --muted: #5a7468;
            --accent: #2f855a;
            --accent-2: #d69e2e;
            --correct: #2f855a;
            --wrong: #c53030;
            --border: rgba(24, 51, 41, 0.12);
            --shadow: 0 18px 50px rgba(30, 60, 46, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
    height: 100vh; /* स्क्रीन की पूरी लंबाई */
    width: 100vw;  /* स्क्रीन की पूरी चौड़ाई */
    overflow: hidden; /* स्क्रॉल बार को हटा देगा */
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Poppins", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(214, 158, 46, 0.24), transparent 28%),
                radial-gradient(circle at bottom right, rgba(47, 133, 90, 0.18), transparent 32%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app-shell {
            width: min(1100px, 100%);
        }

        .quiz-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .hero {
            padding: 16px 28px;
            background:
                linear-gradient(135deg, rgba(47, 133, 90, 0.1), rgba(214, 158, 46, 0.14)),
                #f8fff8;
            border-bottom: 1px solid var(--border);
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero-spacer {
            min-height: 8px;
        }

        .score-pill {
            padding: 12px 18px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid var(--border);
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 16px;
            padding: 14px 28px 0;
            align-items: center;
        }

        .progress-wrap {
            width: 100%;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .progress-track {
            height: 12px;
            border-radius: 999px;
            background: rgba(24, 51, 41, 0.08);
            overflow: hidden;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), #68b684);
            transition: width 0.3s ease;
        }

        .feedback {
            min-height: 24px;
            font-size: 15px;
            font-weight: 600;
        }

        .feedback.correct {
            color: var(--correct);
        }

        .feedback.wrong {
            color: var(--wrong);
        }

        .question-panel {
            padding: 14px 28px 20px;
        }

        .question {
            margin: 0 0 14px;
            font-size: clamp(20px, 2.4vw, 28px);
            line-height: 1.2;
        }

        .question span {
            color: var(--accent);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .bird-option {
            border: 2px solid transparent;
            border-radius: 18px;
            background: #ffffff;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            text-align: left;
            padding: 0;
            min-width: 0;
        }

        .bird-option:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.1);
            border-color: rgba(47, 133, 90, 0.35);
        }

        .bird-option:disabled {
            cursor: default;
        }

        .bird-option.correct {
            border-color: var(--correct);
            background: rgba(47, 133, 90, 0.08);
        }

        .bird-option.wrong {
            border-color: var(--wrong);
            background: rgba(197, 48, 48, 0.08);
        }

        .option-image {
            aspect-ratio: 1 / 1;
            width: 100%;
            max-height: 380px;
            background: #edf6ef;
            display: block;
            object-fit: contain;
            padding: 8px;
        }

        .option-caption {
            padding: 10px 12px 12px;
        }

        .option-title {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .option-subtitle {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-screen {
            display: none;
            padding: 34px 28px 36px;
            text-align: center;
        }

        .result-screen.show {
            display: block;
        }

        .result-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(214, 158, 46, 0.14);
            color: #8a5c00;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .final-score {
            margin: 18px 0 8px;
            font-size: clamp(40px, 8vw, 72px);
            line-height: 1;
        }

        .final-text {
            margin: 0;
            color: var(--muted);
            font-size: 18px;
        }

        .restart-btn {
            margin-top: 24px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), #3ba46e);
            color: #fff;
            padding: 14px 24px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 14px 28px rgba(47, 133, 90, 0.24);
        }

        .restart-btn:hover {
            filter: brightness(1.03);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 980px) {
            .options-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            body {
                padding: 14px;
            }

            .hero,
            .status-bar,
            .question-panel,
            .result-screen {
                padding-left: 18px;
                padding-right: 18px;
            }

            .status-bar {
                grid-template-columns: 1fr;
            }

            .options-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    </div>

        const totalQuestions = 20;
        const imageFallback = "https://placehold.co/800x600/e8efe8/5f6f66?text=Bird+Image";
        const scorePill = document.getElementById("score-pill");
        const questionCount = document.getElementById("question-count");
        const remainingCount = document.getElementById("remaining-count");
        const progressFill = document.getElementById("progress-fill");
        const feedback = document.getElementById("feedback");
        const questionText = document.getElementById("question-text");
        const optionsGrid = document.getElementById("options-grid");
        const gameScreen = document.getElementById("game-screen");
        const resultScreen = document.getElementById("result-screen");
        const finalScore = document.getElementById("final-score");
        const finalText = document.getElementById("final-text");
        const restartBtn = document.getElementById("restart-btn");

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let locked = false;

        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function getUniqueBirds(data) {
            const seen = new Set();
            return data.filter((bird) => {
                const key = bird.commonName.toLowerCase();
                if (seen.has(key)) {
                    return false;
                }
                seen.add(key);
                return true;
            });
        }

function buildQuestions() {
    const uniqueBirds = getUniqueBirds(birdData);
    const selectedBirds = shuffle(uniqueBirds).slice(0, totalQuestions);

    return selectedBirds.map((correctBird) => {
        const wrongOptions = shuffle(
            uniqueBirds.filter((bird) => bird.commonName !== correctBird.commonName)
        ).slice(0, 3);

        return {
            prompt: correctBird.commonName,
            // यहाँ ये दो लाइनें जोड़ें:
            hindi: correctBird.hindiName,       
            scientific: correctBird.scientificName, 
            answer: correctBird.commonName,
            options: shuffle([correctBird, ...wrongOptions])
        };
    });
}

        function getResultMessage() {
            const percent = (score / totalQuestions) * 100;
            if (percent === 100) {
                return "Perfect score. Your bird knowledge is excellent.";
            }
            if (percent >= 80) {
                return "Very strong job. You know your birds well.";
            }
            if (percent >= 60) {
                return "Good work. You are building solid bird recognition skills.";
            }
            if (percent >= 40) {
                return "Nice effort. Try again and you will improve quickly.";
            }
            return "Good start. Play again and learn more birds with each round.";
        }

        function updateHeader() {
            const currentNumber = currentQuestionIndex + 1;
            questionCount.textContent = `Question ${currentNumber} of ${totalQuestions}`;
            remainingCount.textContent = `${Math.max(totalQuestions - currentNumber, 0)} left`;
            progressFill.style.width = `${(currentQuestionIndex / totalQuestions) * 100}%`;
            scorePill.textContent = `Score: ${score} / ${totalQuestions}`;
        }

        function renderQuestion() {
            const current = questions[currentQuestionIndex];
            feedback.textContent = "";
            feedback.className = "feedback";
            locked = false;
            updateHeader();

questionText.innerHTML = `
        Which bird is <span>${current.prompt}</span>? <br>
        <div style="font-size: 16px; color: var(--muted); margin-top: 8px;">
          <i>(${current.scientific})</i>
        </div>
    `;

    optionsGrid.innerHTML = "";

            current.options.forEach((bird) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "bird-option";
                button.dataset.answer = bird.commonName;
                button.innerHTML = `
                    <img
                        class="option-image"
                        src="${bird.link}"
                        alt="${bird.commonName}"
                        onerror="this.onerror=null; this.src='${imageFallback}'"
                    >
                    <div class="option-caption">
                        <span class="option-title">Family: ${bird.family}</span>
                        <span class="option-subtitle">Order: ${bird.order}</span>
                    </div>
                `;

                button.addEventListener("click", () => handleAnswer(button, bird, current.answer));
                optionsGrid.appendChild(button);
            });
        }

        function handleAnswer(selectedButton, selectedBird, correctAnswer) {
            if (locked) {
                return;
            }

            locked = true;
            const isCorrect = selectedBird.commonName === correctAnswer;
            const allButtons = [...optionsGrid.querySelectorAll(".bird-option")];

            allButtons.forEach((button) => {
                button.disabled = true;
                if (button.dataset.answer === correctAnswer) {
                    button.classList.add("correct");
                }
            });

            if (isCorrect) {
                score += 1;
                selectedButton.classList.add("correct");
                feedback.textContent = "Correct answer.";
                feedback.className = "feedback correct";
            } else {
                selectedButton.classList.add("wrong");
                feedback.textContent = `Wrong answer. Correct bird: ${correctAnswer}`;
                feedback.className = "feedback wrong";
            }

            scorePill.textContent = `Score: ${score} / ${totalQuestions}`;

            setTimeout(() => {
                currentQuestionIndex += 1;

                if (currentQuestionIndex >= totalQuestions) {
                    showResults();
                    return;
                }

                renderQuestion();
            }, 1500);
        }

        function showResults() {
            progressFill.style.width = "100%";
            gameScreen.classList.add("hidden");
            resultScreen.classList.add("show");
            finalScore.textContent = `${score} / ${totalQuestions}`;
            finalText.textContent = getResultMessage();
        }

        function startGame() {
            questions = buildQuestions();
            currentQuestionIndex = 0;
            score = 0;
            locked = false;
            gameScreen.classList.remove("hidden");
            resultScreen.classList.remove("show");
            scorePill.textContent = `Score: 0 / ${totalQuestions}`;
            renderQuestion();
        }

        restartBtn.addEventListener("click", startGame);
        startGame();
    </script>
