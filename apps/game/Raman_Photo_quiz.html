<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Identification Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --card: #ffffff;
        --accent: #2563eb;
        --correct: #16a34a;
        --wrong: #dc2626;
        --text: #1e293b;
        --muted: #64748b;
        --bg: #f8fafc;
        --border: #e2e8f0;
        --option-bg: #ffffff;
        --header-from: #2563eb;
        --header-to: #4f46e5;
        --progress-bg: #e5e7eb;
        --timer-normal: #0ca806;
        --timer-warn: #f59e0b;
        --timer-danger: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card: #1e293b;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --bg: #0f172a;
          --border: #334155;
          --option-bg: #1e293b;
          --progress-bg: #334155;
        }
      }

      * { font-family: "Poppins", sans-serif; box-sizing: border-box; }
      body { background: linear-gradient(135deg, #d1fae5 0%, #cffafe 40%, #dbeafe 100%); min-height: 100vh; margin: 0; padding: 0; }
      @media (prefers-color-scheme: dark) { body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); } }

      .quiz-card { width: 100%; max-width: 1200px; background: var(--card); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.13); margin: auto; }
      .header { padding: 20px 24px; background: linear-gradient(135deg, var(--header-from), var(--header-to)); color: white; }
      .header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .quiz-controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

      #fullscreenBtn { padding: 5px 12px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.2); color: white; font-size: 18px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
      #fullscreenBtn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

      #numQuestions { width: 60px; padding: 5px 8px; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 8px; font-size: 15px; font-weight: 600; text-align: center; background: rgba(255, 255, 255, 0.2); color: white; outline: none; }
      #startBtn { padding: 5px 14px; border: none; border-radius: 8px; background: white; color: #2563eb; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
      #startBtn:hover { background: #f0f4ff; transform: scale(1.04); }

      .title { font-size: 24px; font-weight: 700; text-align: center; flex: 1; min-width: 160px; }
      .score-box { background: white; color: #111; padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; flex-shrink: 0; transition: transform 0.2s; }
      .score-box.pop { animation: popAnim 0.35s; }
      @keyframes popAnim { 50% { transform: scale(1.18); } 100% { transform: scale(1); } }

      .progress-area { padding: 16px 24px 0; }
      .progress-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: var(--muted); }
      .progress-bar { height: 20px; background: var(--progress-bg); border-radius: 999px; overflow: hidden; }
      .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #60a5fa); transition: width 0.4s ease; }

      .timer-row { display: flex; align-items: center; gap: 10px; padding: 10px 24px 0; }
      .timer-bar-wrap { flex: 1; height: 8px; background: var(--progress-bg); border-radius: 999px; overflow: hidden; }
      .timer-bar { height: 100%; width: 100%; background: var(--timer-normal); transition: width 1s linear, background 0.3s; border-radius: 999px; }
      .timer-count { font-size: 14px; font-weight: 700; min-width: 28px; text-align: right; color: var(--timer-normal); transition: color 0.3s; }
      .timer-count.warn { color: var(--timer-warn); }
      .timer-count.danger { color: var(--timer-danger); }
      .timer-bar.warn { background: var(--timer-warn); }
      .timer-bar.danger { background: var(--timer-danger); }

      .content { padding: 24px 24px 20px; }
      .question-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
      .question { font-size: 32px; font-weight: 800; line-height: 1.3; color: var(--text); text-align: center; flex: 1; }
      .question .hi-text { font-size: 22px; font-weight: 600; color: #4b5563; display: block; margin-top: 4px; }

      .speak-btn { width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer; font-size: 20px; flex-shrink: 0; background: linear-gradient(135deg, #0d9488, #0f766e); color: white; transition: all 0.25s; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25); }
      .speak-btn:hover { transform: translateY(-2px) scale(1.06); box-shadow: 0 8px 20px rgba(13, 148, 136, 0.4); }

      .options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      @media (max-width: 900px) { .options { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 500px) { .options { grid-template-columns: 1fr; } }

      .option { position: relative; border: 3px solid var(--border); border-radius: 16px; cursor: pointer; background: var(--option-bg); transition: all 0.22s ease; overflow: hidden; padding: 4px; aspect-ratio: 1 / 1; }
      .option img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; display: block; }
      .option-label { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); color: #2563eb; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); z-index: 10; transition: 0.2s; }

      .option:hover:not(.correct):not(.wrong):not(.disabled) { border-color: #fbbf24; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(251, 191, 36, 0.25); }
      .option:focus-visible:not(.disabled) { border-color: #fbbf24; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(251, 191, 36, 0.25); outline: 3px solid #3b82f6; }
      .option.correct { border-color: #10b981; background: #d1fae5; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3); }
      .option.correct .option-label { background: #16a34a; color: white; }
      .option.wrong { border-color: #ef4444; background: #fee2e2; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.3); }
      .option.wrong .option-label { background: #dc2626; color: white; }
      .option.disabled { opacity: 0.8; cursor: not-allowed; pointer-events: none; }

      .feedback { margin-top: 16px; font-size: 18px; font-weight: 700; min-height: 28px; text-align: center; }
      .result { display: none; padding: 36px 28px; text-align: center; color: var(--text); }
      .result-score-ring { width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: white; }
      .result-score-ring .sub { font-size: 13px; font-weight: 500; opacity: 0.85; }

      .grade-badge { display: inline-block; padding: 6px 24px; border-radius: 999px; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
      .stats-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
      .stat-pill { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--muted); }
      .stat-pill span { display: block; font-size: 22px; font-weight: 700; color: var(--text); }

      .result-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
      .btn-action { border: none; padding: 11px 22px; font-size: 15px; border-radius: 999px; cursor: pointer; background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; font-weight: 600; }
      .btn-action.amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
      .btn-action.rose { background: linear-gradient(135deg, #f43f5e, #e11d48); }

      #reviewAnswers { text-align: left; margin-top: 20px; display: none; }
      .review-item { margin-bottom: 12px; padding: 14px; background: #fef2f2; border-left: 4px solid #dc2626; border-radius: 10px; display: flex; align-items: center; gap: 16px; }
      .review-item img { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; border: 2px solid #16a34a; }

      #homePage textarea { font-family: monospace; font-size: 14px; background: rgba(255, 255, 255, 0.9); border: 1.5px solid #cbd5e1; }
      #homePage textarea:focus { border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15); background: white; }
      #quizInput.drag-over { border-color: #0d9488 !important; background-color: #f0fdfa !important; box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.2) !important; transform: scale(1.01); transition: all 0.2s ease; }

      .saved-list { margin-top: 10px; width: 100%; max-width: 800px; }
      .saved-item { background: white; border: 1px solid #dbeafe; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
      .saved-item:hover { background: #eff6ff; border-color: #93c5fd; }
      .saved-item .si-name { font-weight: 600; font-size: 14px; color: #1e293b; }
      .saved-item .si-meta { font-size: 12px; color: #64748b; }
      .saved-item-actions { display: flex; gap: 10px; align-items: center; }
      .export-btn { background: none; border: none; cursor: pointer; color: #0ea5e9; font-size: 18px; padding: 0 4px; line-height: 1; transition: 0.2s; }
      .export-btn:hover { color: #0284c7; transform: scale(1.2); }
      .del-btn { background: none; border: none; cursor: pointer; color: #dc2626; font-size: 18px; padding: 0 4px; line-height: 1; }

      :fullscreen #mainQuizWrapper { padding: 3vh 3vw !important; height: 100vh; align-items: center; }
      :fullscreen .quiz-card { max-width: 1600px; width: 100%; height: 100%; border-radius: 24px; box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; margin: auto; }
      :fullscreen #quizScreen, :fullscreen .result { flex: 1; display: flex; flex-direction: column; }
      :fullscreen .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    </style>
  </head>

  <body>
    <div id="homePage" class="min-h-screen p-4 sm:p-6 flex flex-col justify-center items-center">
      <div class="w-full max-w-5xl flex flex-col py-6 gap-4" style="min-height: 90vh">
        <div class="flex flex-col text-center bg-gradient-to-br from-teal-600 via-emerald-600 to-green-700 p-6 rounded-2xl shadow-xl relative overflow-hidden">
          <h1 class="text-3xl font-extrabold text-white mb-1 relative z-10">
            🦅 Visual Identification Quiz
          </h1>
          <p class="text-green-100 font-medium relative z-10 text-sm">
            Paste your JSON Array of Items below or Drag & Drop a File to begin.
          </p>
        </div>

        <textarea
          id="quizInput"
          wrap="off"
          rows="12"
          placeholder='[&#10;  {&#10;    "Name": "English Name",&#10;    "Hindi": "हिंदी नाम",&#10;    "link": "https://..."&#10;  }&#10;]'
          class="w-full p-4 border rounded-xl shadow-sm resize-none outline-none text-sm leading-relaxed overflow-x-auto"
        ></textarea>
        
        <div class="flex gap-3 items-center justify-center flex-wrap mt-2">
          <input
            id="quizName"
            type="text"
            placeholder="Dataset Name (optional)"
            class="flex-1 max-w-[200px] px-4 py-3 rounded-xl border border-gray-300 text-sm font-medium outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-200"
          />
          <button
            onclick="copyQuizPrompt()"
            id="copyPromptBtn"
            class="px-5 py-3 rounded-xl font-bold text-white text-sm transition-all shadow bg-gradient-to-r from-blue-500 to-cyan-600 hover:from-blue-600 hover:to-cyan-700 hover:-translate-y-0.5"
          >
            📋 Copy Prompt
          </button>
          <button
            onclick="saveQuizToStorage()"
            class="px-5 py-3 rounded-xl font-bold text-white text-sm transition-all shadow bg-gradient-to-r from-violet-500 to-purple-600 hover:from-violet-600 hover:to-purple-700 hover:-translate-y-0.5"
          >
            💾 Save Data
          </button>
          <button
            onclick="createQuizFromText()"
            class="px-8 py-3 rounded-xl font-bold text-white text-lg transition-all shadow bg-gradient-to-r from-teal-600 to-emerald-700 hover:from-teal-700 hover:to-emerald-800 hover:-translate-y-0.5"
          >
            🚀 Start Quiz
          </button>
        </div>

        <div id="savedSection" style="display: none; width: 100%; display: flex; flex-direction: column; align-items: center;">
          <p class="text-sm font-bold text-gray-600 mt-4 mb-1">💾 Saved Datasets</p>
          <div id="savedList" class="saved-list"></div>
        </div>
      </div>
    </div>

    <div id="mainQuizWrapper" class="w-full min-h-screen flex justify-center p-4 sm:p-8" style="display: none !important; overflow-y: auto;">
      <div class="quiz-card" id="mainQuiz">
        <div class="header">
          <div class="header-row">
            <div class="quiz-controls">
              <input type="number" id="numQuestions" min="1" title="Number of Questions" />
              <button id="startBtn" onclick="startQuiz()">▶ Restart</button>
            </div>
            <div class="title">Visual ID Challenge</div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="score-box" id="scoreBox">Score: 0</div>
              <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">⛶</button>
            </div>
          </div>
        </div>

        <div id="quizScreen">
          <div class="progress-area">
            <div class="progress-info">
              <span id="questionNumber"></span>
              <span id="remaining"></span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="timer-row">
            <span id="pauseTimerBtn" onclick="toggleTimer()" style="font-size: 20px; cursor: pointer; user-select: none" title="Pause Timer (Space)">⏸️</span>
            <div class="timer-bar-wrap">
              <div class="timer-bar" id="timerBar"></div>
            </div>
            <span class="timer-count" id="timerCount">30</span>
          </div>

          <div class="content">
            <div class="question-wrapper">
              <div class="question" id="question"></div>
              <button id="speakBtn" class="speak-btn" title="Speak Question (Space)">🔊</button>
            </div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>

        <div class="result" id="result">
          <div class="result-score-ring" id="scoreRing">
            <div id="finalScore"></div>
            <div class="sub" id="finalFraction"></div>
          </div>

          <div class="grade-badge" id="gradeBadge"></div>
          <p id="gradeMsg" style="font-size: 15px; color: var(--muted); margin: 4px 0 16px"></p>

          <div class="stats-row">
            <div class="stat-pill">Accuracy<span id="statAccuracy">—</span></div>
            <div class="stat-pill">Correct<span id="statCorrect">—</span></div>
            <div class="stat-pill">Wrong<span id="statWrong">—</span></div>
            <div class="stat-pill">Skipped<span id="statSkipped">—</span></div>
          </div>

          <div class="result-actions">
            <button class="btn-action amber" id="toggleReviewBtn" style="display: none" onclick="toggleReview()">👁 View Wrong Answers</button>
            <button class="btn-action rose" id="retryBtn" style="display: none" onclick="retryWrongAnswers()">🔄 Retry Wrong</button>
            <button class="btn-action" onclick="goHome()" style="background: linear-gradient(135deg, #475569, #334155)">🏠 New Data</button>
          </div>

          <div id="reviewAnswers"></div>
        </div>
      </div>
    </div>

    <script>
      let rawItems = [];
      let quiz = [];
      let activeQuiz = [];
      let wrongQuestions = [];
      let current = 0, score = 0, skipped = 0;
      let locked = false;
      let timerInterval = null;
      let timeLeft = 30;
      const TIMER_SECONDS = 30;
      let timerPaused = false;

      // ── COPY PROMPT (UPDATED FOR HINDI & JSON FORMAT) ──
      function copyQuizPrompt() {
        const promptText = `Act as an Expert Educational Content Creator. I want you to help me generate datasets for a "Visual Identification Quiz".

I will provide a specific topic in my NEXT message. Please DO NOT generate the JSON yet.

When I give you the topic, you must generate a JSON array of 15 items following these CRITICAL RULES:
1. LANGUAGE (STRICT): All scientific and technical terminology MUST remain in English. Do NOT translate technical terms into Hindi. Provide the common Hindi translation in the "Hindi" field ONLY if applicable, otherwise leave it blank or repeat the English term.
2. IMAGES: Provide direct, working, and publicly accessible image links. 
3. FAST LOADING: Always use thumbnail URLs. If using Wikimedia Commons, use the exact API format like this: https://commons.wikimedia.org/wiki/Special:FilePath/Filename.jpg?width=600
4. CLEAN OUTPUT: Output ONLY the raw JSON array. NO markdown formatting, NO \`\`\`json tags, NO introductory text, and NO trailing commas.
5. FORMATTING: The JSON MUST be pretty-printed with proper indentation and line breaks.

Data Format Example:
[
  {
    "Name": "English Name",
    "Hindi": "हिंदी नाम",
    "link": "https://direct-image-url-1.jpg"
  }
]

If you understand these instructions, reply exactly with: "Ready for your content or topic." and wait for my input.`;

        navigator.clipboard.writeText(promptText).then(() => {
          const btn = document.getElementById("copyPromptBtn");
          const orig = btn.innerHTML;
          btn.innerHTML = "✅ Copied!";
          btn.classList.add("from-green-500", "to-emerald-600");
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.classList.remove("from-green-500", "to-emerald-600");
          }, 2500);
        }).catch(() => alert("Clipboard access denied."));
      }

      // ── ROBUST PARSER ──
      function safeParsePhotoData(raw) {
        try {
          return JSON.parse(raw);
        } catch(e) {
          console.warn("Standard parsing failed, attempting recovery mode...");
          let extractedItems = [];
          const objStrings = raw.match(/\{[\s\S]*?\}/g) || [];
          objStrings.forEach((objStr) => {
            try {
              let cleanStr = objStr.replace(/,\s*\}/g, "}");
              cleanStr = cleanStr.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
              extractedItems.push(JSON.parse(cleanStr));
            } catch (err) { }
          });
          return extractedItems;
        }
      }

      // ── SMART IMAGE FALLBACK SYSTEM (STRICTLY ENGLISH SEARCH) ──
      async function handleImageFallback(img, itemName) {
        let loader = img.previousElementSibling;
        
        if (img.dataset.fallbackAttempted === "true") {
            if (loader) loader.innerHTML = '❌ Error';
            img.style.display = 'none';
            return;
        }
        
        img.dataset.fallbackAttempted = "true";
        if (loader) {
            loader.innerHTML = '🔄 Searching...';
            loader.style.display = 'block';
        }

        try {
            // ONLY searches Wikipedia using the English 'itemName'
            const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(itemName)}`);
            if (!response.ok) throw new Error('Wiki fetch failed');
            
            const data = await response.json();
            
            if (data.thumbnail && data.thumbnail.source) {
                img.src = data.thumbnail.source;
            } else {
                throw new Error('No image found in fallback');
            }
        } catch (error) {
            if (loader) loader.innerHTML = '❌ Error';
            img.style.display = 'none';
        }
      }

      // ── LOCAL STORAGE & RENDER LIST ──
      function saveQuizToStorage() {
        const txt = document.getElementById("quizInput").value.trim();
        if (!txt) return alert("Please paste the JSON data first.");
        let name = document.getElementById("quizName").value.trim();
        if (!name) name = "Visual Set " + new Date().toLocaleDateString("en-IN");

        const saved = JSON.parse(localStorage.getItem("savedVisualQuizzes") || "[]");
        saved.unshift({ name, data: txt, date: new Date().toISOString() });
        if (saved.length > 10) saved.pop();
        localStorage.setItem("savedVisualQuizzes", JSON.stringify(saved));
        renderSavedList();
        alert("✅ Dataset Saved: " + name);
      }

      function renderSavedList() {
        const saved = JSON.parse(localStorage.getItem("savedVisualQuizzes") || "[]");
        const section = document.getElementById("savedSection");
        const list = document.getElementById("savedList");
        if (saved.length === 0) {
          section.style.display = "none";
          return;
        }
        section.style.display = "flex";
        list.innerHTML = "";
        saved.forEach((item, idx) => {
          const div = document.createElement("div");
          div.className = "saved-item";
          div.innerHTML = `
            <div>
              <div class="si-name">${item.name}</div>
              <div class="si-meta">${new Date(item.date).toLocaleString("en-IN")}</div>
            </div>
            <div class="saved-item-actions">
              <button class="export-btn" title="Download Offline" onclick="exportSavedQuiz(${idx}, event)">📥</button>
              <button class="del-btn" title="Delete" onclick="deleteSavedQuiz(${idx}, event)">🗑</button>
            </div>
          `;
          div.onclick = (e) => {
            if (e.target.closest('button')) return; 
            document.getElementById("quizInput").value = item.data;
            document.getElementById("quizName").value = item.name;
          };
          list.appendChild(div);
        });
      }

      function deleteSavedQuiz(idx, e) {
        e.stopPropagation();
        const saved = JSON.parse(localStorage.getItem("savedVisualQuizzes") || "[]");
        saved.splice(idx, 1);
        localStorage.setItem("savedVisualQuizzes", JSON.stringify(saved));
        renderSavedList();
      }

      // ── BUILD QUIZ ──
      function createQuizFromText() {
        let txt = document.getElementById("quizInput").value.trim();
        if (!txt) return alert("Please paste the JSON data first.");
        if (!txt.startsWith("[")) txt = "[" + txt;
        if (!txt.endsWith("]")) txt = txt.replace(/,\s*$/, "") + "]";

        let extractedItems = safeParsePhotoData(txt);
        
        rawItems = extractedItems
          // Parsing both English (Name) and Hindi names safely
          .map(item => ({ Name: item.Name || item.name, Hindi: item.Hindi || item.hindi || "", link: item.link }))
          .filter(item => item.Name && item.link);

        if (rawItems.length < 4) {
          return alert(`Error: Found ${rawItems.length} valid items, but at least 4 are needed to create multiple choices.`);
        }

        quiz = rawItems.map(correctItem => {
          let incorrectPool = rawItems.filter(item => item.Name !== correctItem.Name);
          incorrectPool = shuffleArray(incorrectPool);
          let optionsSet = shuffleArray([correctItem, incorrectPool[0], incorrectPool[1], incorrectPool[2]]);
          let correctIndex = optionsSet.findIndex(item => item.Name === correctItem.Name);

          // Direct English Name + Optional Hindi Name (No extra text)
          let questionHTML = `<span class="text-blue-600">${correctItem.Name}</span>`;
          if (correctItem.Hindi) {
            questionHTML += `<span class="hi-text">${correctItem.Hindi}</span>`;
          }

          let speakText = correctItem.Name;
          if (correctItem.Hindi) {
            speakText += " . " + correctItem.Hindi;
          }

          return {
            q: questionHTML,
            plainText: speakText,
            o: optionsSet.map(opt => opt.link),
            o_names: optionsSet.map(opt => opt.Name), // strictly english for fallback
            a: correctIndex,
            correctItemData: correctItem
          };
        });

        document.getElementById("homePage").style.display = "none";
        document.getElementById("mainQuizWrapper").style.display = "flex";
        document.getElementById("numQuestions").value = quiz.length;
        document.getElementById("numQuestions").max = quiz.length;
        startQuiz();
      }

      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startQuiz() {
        let n = parseInt(document.getElementById("numQuestions").value);
        if (isNaN(n) || n < 1) n = quiz.length;
        if (n > quiz.length) n = quiz.length;
        activeQuiz = shuffleArray(JSON.parse(JSON.stringify(quiz))).slice(0, n);
        wrongQuestions = [];
        current = 0; score = 0; skipped = 0;
        
        document.getElementById("scoreBox").textContent = "Score: 0";
        document.getElementById("result").style.display = "none";
        document.getElementById("quizScreen").style.display = "block";
        loadQuestion();
      }

      // ── TIMER ──
      function startTimer() {
        clearInterval(timerInterval);
        timeLeft = TIMER_SECONDS;
        updateTimerUI();
        timerInterval = setInterval(() => {
          if (timerPaused) return;
          timeLeft--;
          updateTimerUI();
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!locked) timeUp();
          }
        }, 1000);
      }

      function toggleTimer() {
        timerPaused = !timerPaused;
        const btn = document.getElementById("pauseTimerBtn");
        if (timerPaused) {
          btn.innerHTML = "▶️";
          document.getElementById("timerBar").style.opacity = "0.4";
        } else {
          btn.innerHTML = "⏸️";
          document.getElementById("timerBar").style.opacity = "1";
        }
      }

      function updateTimerUI() {
        const bar = document.getElementById("timerBar");
        const count = document.getElementById("timerCount");
        bar.style.width = (timeLeft / TIMER_SECONDS) * 100 + "%";
        count.textContent = timeLeft;
        bar.className = "timer-bar";
        count.className = "timer-count";
        if (timeLeft <= 5) { bar.classList.add("danger"); count.classList.add("danger"); }
        else if (timeLeft <= 10) { bar.classList.add("warn"); count.classList.add("warn"); }
      }

      function timeUp() {
        locked = true; skipped++;
        speechSynthesis.cancel();
        const correct = activeQuiz[current].a;
        document.querySelectorAll(".option").forEach((o, i) => {
          o.classList.add("disabled");
          if (i === correct) o.classList.add("correct");
        });
        document.getElementById("feedback").innerHTML = '<span style="color:#dc2626">⏰ Time\'s up! Correct answer highlighted.</span>';
        wrongQuestions.push({ ...activeQuiz[current], _timedOut: true });
        playSound("wrong");
        setTimeout(() => goNext(), 1500);
      }

      // ── RENDER & INTERACT ──
      function loadQuestion() {
        locked = false;
        document.getElementById("feedback").textContent = "";
        const q = activeQuiz[current];
        document.getElementById("question").innerHTML = q.q;
        document.getElementById("questionNumber").textContent = `Question ${current + 1} / ${activeQuiz.length}`;
        document.getElementById("remaining").textContent = `${activeQuiz.length - current} Left`;
        document.getElementById("progressFill").style.width = `${(current / activeQuiz.length) * 100}%`;

        const labels = ["1", "2", "3", "4"];
        const optContainer = document.getElementById("options");
        optContainer.innerHTML = "";

        q.o.forEach((imgLink, index) => {
          const btn = document.createElement("div");
          btn.className = "option";
          btn.setAttribute("role", "button");
          btn.setAttribute("aria-label", `Option ${labels[index]}`);
          btn.setAttribute("tabindex", "0");
          
          const safeName = q.o_names[index].replace(/'/g, "\\'");

          btn.innerHTML = `
            <div class="option-label">${labels[index]}</div>
            <div class="img-loader" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #64748b; font-size: 14px; font-weight: 600; z-index: 1;">
              ⏳ Loading...
            </div>
            <img src="${imgLink}" alt="Option ${labels[index]}" style="position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; border-radius: 12px; background: var(--option-bg);" loading="lazy" 
              onload="if(this.previousElementSibling) this.previousElementSibling.style.display='none';" 
              onerror="handleImageFallback(this, '${safeName}')" />
          `;
          btn.addEventListener("mouseenter", () => { if (!locked) playSound("hover"); });
          btn.onclick = () => checkAnswer(btn, index);
          btn.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); checkAnswer(btn, index); }
          });
          optContainer.appendChild(btn);
        });
        startTimer();
      }

      function checkAnswer(btn, index) {
        if (locked) return;
        locked = true;
        clearInterval(timerInterval);
        speechSynthesis.cancel();

        const correct = activeQuiz[current].a;
        document.querySelectorAll(".option").forEach((o, i) => {
          o.classList.add("disabled");
          if (i === correct) o.classList.add("correct");
        });

        const fb = document.getElementById("feedback");
        if (index === correct) {
          score++;
          fb.innerHTML = '<span style="color:#16a34a">✅ Correct!</span>';
          playSound("correct");
        } else {
          btn.classList.add("wrong");
          wrongQuestions.push(activeQuiz[current]);
          fb.innerHTML = '<span style="color:#dc2626">❌ Incorrect!</span>';
          playSound("wrong");
        }

        const sb = document.getElementById("scoreBox");
        sb.textContent = `Score: ${score}`;
        sb.classList.remove("pop");
        void sb.offsetWidth; 
        sb.classList.add("pop");

        setTimeout(() => goNext(), 1500);
      }

      function goNext() {
        current++;
        if (current >= activeQuiz.length) showResult();
        else loadQuestion();
      }

      // ── RESULTS & REVIEW ──
      function showResult() {
        clearInterval(timerInterval);
        document.getElementById("quizScreen").style.display = "none";
        document.getElementById("result").style.display = "block";

        const total = activeQuiz.length;
        const accuracy = total > 0 ? Math.round((score / total) * 100) : 0;
        const ring = document.getElementById("scoreRing");
        const colors = accuracy >= 80 ? ["#16a34a", "#15803d"] : accuracy >= 60 ? ["#2563eb", "#1d4ed8"] : accuracy >= 40 ? ["#f59e0b", "#d97706"] : ["#dc2626", "#b91c1c"];
        ring.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;

        document.getElementById("finalScore").textContent = score;
        document.getElementById("finalFraction").textContent = `/ ${total}`;

        const { grade, msg } = getGrade(accuracy);
        const gb = document.getElementById("gradeBadge");
        gb.textContent = grade; gb.style.background = colors[0]; gb.style.color = "white";
        document.getElementById("gradeMsg").textContent = msg;

        document.getElementById("statAccuracy").textContent = accuracy + "%";
        document.getElementById("statCorrect").textContent = score;
        document.getElementById("statWrong").textContent = wrongQuestions.filter(q => !q._timedOut).length;
        document.getElementById("statSkipped").textContent = wrongQuestions.filter(q => q._timedOut).length;

        const toggleBtn = document.getElementById("toggleReviewBtn");
        const retryBtn = document.getElementById("retryBtn");
        const reviewDiv = document.getElementById("reviewAnswers");

        if (wrongQuestions.length > 0) {
          toggleBtn.style.display = "inline-block"; toggleBtn.textContent = "👁 View Wrong Answers";
          retryBtn.style.display = "inline-block";
          let html = '<h3 style="font-weight:700;margin-bottom:12px;">Wrong Answers Review:</h3>';
          wrongQuestions.forEach(q => {
            let safeName = q.correctItemData.Name.replace(/'/g, "\\'");
            let reviewNameHTML = q.correctItemData.Name;
            if(q.correctItemData.Hindi) {
                reviewNameHTML += ` <span style="color:#64748b; font-size:14px; margin-left:6px;">(${q.correctItemData.Hindi})</span>`;
            }

            html += `
              <div class="review-item">
                <div style="position: relative; width: 100px; height: 100px; flex-shrink: 0; border-radius: 8px; border: 2px solid #16a34a; overflow: hidden; background: #fff;">
                  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #64748b; text-align: center; z-index: 1;">
                    ⏳
                  </div>
                  <img src="${q.correctItemData.link}" alt="Correct Option" style="position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover;" 
                    onload="if(this.previousElementSibling) this.previousElementSibling.style.display='none';" 
                    onerror="handleImageFallback(this, '${safeName}')" />
                </div>
                <div>
                  <div style="font-weight:700; color:var(--text); margin-bottom:4px;">${reviewNameHTML}</div>
                  <div style="font-size:13px; color:#16a34a; font-weight:600;">✅ This was the correct image</div>
                </div>
              </div>`;
          });
          reviewDiv.innerHTML = html; reviewDiv.style.display = "none";
        } else {
          toggleBtn.style.display = "none"; retryBtn.style.display = "none"; reviewDiv.innerHTML = "";
        }
      }

      function getGrade(acc) {
        if (acc >= 90) return { grade: "A+", msg: "Excellent! Outstanding performance 🎉" };
        if (acc >= 80) return { grade: "A", msg: "Great job! Very well done 👏" };
        if (acc >= 70) return { grade: "B", msg: "Good effort! You can still improve 👍" };
        if (acc >= 60) return { grade: "C", msg: "Not bad, keep learning 📚" };
        if (acc >= 40) return { grade: "D", msg: "Needs more practice 🔁" };
        return { grade: "F", msg: "Don't give up! Try again 💪" };
      }

      function toggleReview() {
        const rd = document.getElementById("reviewAnswers"), btn = document.getElementById("toggleReviewBtn");
        if (rd.style.display === "none") { rd.style.display = "block"; btn.textContent = "🙈 Hide Wrong Answers"; }
        else { rd.style.display = "none"; btn.textContent = "👁 View Wrong Answers"; }
      }

      function retryWrongAnswers() {
        if (wrongQuestions.length === 0) return;
        const src = wrongQuestions.map(q => { const c = { ...q }; delete c._timedOut; return c; });
        activeQuiz = shuffleArray(src);
        wrongQuestions = []; current = 0; score = 0; skipped = 0;
        document.getElementById("scoreBox").textContent = "Score: 0";
        document.getElementById("result").style.display = "none";
        document.getElementById("quizScreen").style.display = "block";
        loadQuestion();
      }

      function goHome() {
        clearInterval(timerInterval);
        speechSynthesis.cancel();
        document.getElementById("mainQuizWrapper").style.display = "none";
        document.getElementById("homePage").style.display = "flex";
      }

      // ── FULLSCREEN LOGIC ──
      function toggleFullscreen() {
        const btn = document.getElementById("fullscreenBtn");
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => { console.log(err.message); });
          btn.innerHTML = "✖";
          btn.title = "Exit Fullscreen (F)";
        } else {
          if (document.exitFullscreen) { document.exitFullscreen(); }
          btn.innerHTML = "⛶";
          btn.title = "Toggle Fullscreen (F)";
        }
      }

      // ── AUDIO & SPEECH (TTS) ──
      if (speechSynthesis.onvoiceschanged !== undefined) { speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

      function speakQuestion() {
        speechSynthesis.cancel();
        if (!activeQuiz[current]) return;
        const u = new SpeechSynthesisUtterance(activeQuiz[current].plainText);
        u.rate = 0.85; u.pitch = 1;
        
        const voices = speechSynthesis.getVoices();
        // Indian voices (English or Hindi) generally read both texts correctly without breaking
        const best = voices.find(v => v.lang === "hi-IN" || v.lang === "hi")
                  || voices.find(v => v.lang === "en-IN")
                  || voices.find(v => v.lang.startsWith("en"))
                  || voices[0];
        if (best) u.voice = best;
        speechSynthesis.speak(u);
      }
      document.getElementById("speakBtn").onclick = speakQuestion;

      function playSound(type) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === "correct") {
          osc.type = "sine"; osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start(); osc.stop(ctx.currentTime + 0.2);
        } else if (type === "wrong") {
          osc.type = "sawtooth"; osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.4, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        } else if (type === "hover") {
          osc.type = "sine"; osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.025, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start(); osc.stop(ctx.currentTime + 0.05);
        }
      }

      // ── KEYBOARD SHORTCUTS ──
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
        const key = e.key.toLowerCase();
        if (e.code === "Space") {
          e.preventDefault();
          if (document.getElementById("quizScreen").style.display !== "none" && !locked) speakQuestion();
          return;
        }
        if (key === "f") { toggleFullscreen(); return; }
        if (!locked && ["1", "2", "3", "4"].includes(e.key)) {
          const opts = document.querySelectorAll(".option");
          const idx = parseInt(e.key) - 1;
          if (opts[idx]) opts[idx].click();
          return;
        }
        if (key === "s") { document.getElementById("startBtn")?.click(); return; }
        if (key === "r" && document.getElementById("result").style.display === "block") {
          const t = document.getElementById("toggleReviewBtn");
          if (t && t.style.display !== "none") t.click();
          return;
        }
        if (key === "w" && document.getElementById("result").style.display === "block") {
          const r = document.getElementById("retryBtn");
          if (r && r.style.display !== "none") r.click();
          return;
        }
        if (key === "m") { speechSynthesis.cancel(); return; }
      });

      // ── DRAG AND DROP FILE UPLOAD ──
      const quizInputArea = document.getElementById("quizInput");

      quizInputArea.addEventListener("dragover", (e) => {
        e.preventDefault(); 
        quizInputArea.classList.add("drag-over");
      });

      quizInputArea.addEventListener("dragleave", (e) => {
        e.preventDefault();
        quizInputArea.classList.remove("drag-over");
      });

      quizInputArea.addEventListener("drop", (e) => {
        e.preventDefault();
        quizInputArea.classList.remove("drag-over");
        
        if (e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          if (file.name.endsWith(".json") || file.name.endsWith(".txt") || file.type.match("text.*")) {
            const reader = new FileReader();
            reader.onload = (event) => {
              quizInputArea.value = event.target.result;
              const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
              document.getElementById("quizName").value = fileNameWithoutExt;
            };
            reader.readAsText(file);
          } else {
            alert("Error: कृपया केवल .txt या .json फ़ाइलें ही ड्रॉप करें।");
          }
        }
      });

      // ── STANDALONE OFFLINE EXPORT ──
      function exportSavedQuiz(idx, e) {
        e.stopPropagation(); 
        
        const saved = JSON.parse(localStorage.getItem("savedVisualQuizzes") || "[]");
        const item = saved[idx];
        if (!item) return;

        let safeName = item.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        let clone = document.documentElement.cloneNode(true);

        clone.querySelector("#quizInput").textContent = item.data;
        clone.querySelector("#quizName").setAttribute("value", item.name);

        let savedSection = clone.querySelector("#savedSection");
        if(savedSection) savedSection.style.display = "none";

        let finalHTML = "<!doctype html>\n<html lang='en'>\n" + clone.innerHTML + "\n</html>";

        const blob = new Blob([finalHTML], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = safeName + "_offline.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        alert(`✅ Offline Quiz Exported: ${item.name}`);
      }

      renderSavedList();
    </script>
  </body>
</html>
